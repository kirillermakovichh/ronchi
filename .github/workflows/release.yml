name: Native distribution

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'dashboard/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'build.rs'
      - 'install.sh'
      - 'scripts/**'
      - 'release/**'
      - 'LICENSE'
      - '.github/workflows/release.yml'
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: native-distribution-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.5'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify version and native target
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          rustup show
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_TARGET"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python3 -c 'import os,tomllib; assert os.environ["RELEASE_TAG"] == "v" + tomllib.load(open("Cargo.toml", "rb"))["package"]["version"]'
          fi
      - name: Restore Cargo downloads
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-v1-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'release/surfpool.json') }}
          restore-keys: cargo-downloads-v1-${{ matrix.target }}-
      - name: Restore Rust build
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/debug
            target/release
          key: native-v1-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.github/workflows/release.yml') }}-${{ github.sha }}
          # Reuse dependency artifacts across patch-version changes too.
          # Cargo still validates source, feature, profile and compiler fingerprints.
          restore-keys: |
            native-v1-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.github/workflows/release.yml') }}-
            native-v1-${{ matrix.target }}-
      - name: Restore license generator
        id: tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ronchi-release-tools
          key: release-tools-v1-${{ matrix.target }}-${{ matrix.runner }}-${{ hashFiles('rust-toolchain.toml') }}-cargo-about-0.9.3-cli
      - name: Build embedded dashboard
        run: |
          npm --prefix dashboard ci
          npm --prefix dashboard run build
      - name: Verify Rust and installer
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          python3 scripts/test-installer.py
      - name: Build native executable
        run: cargo build --release --locked
      - name: Install license generator
        id: install-license
        run: |
          tool_root="$RUNNER_TEMP/ronchi-release-tools"
          if [ ! -x "$tool_root/bin/cargo-about" ]; then
            cargo install cargo-about --version 0.9.3 --locked --features cli --root "$tool_root"
          fi
          test "$("$tool_root/bin/cargo-about" --version)" = 'cargo-about 0.9.3'
          echo "$tool_root/bin" >> "$GITHUB_PATH"
      - name: Generate dependency notices
        run: python3 scripts/release-notices.py --target '${{ matrix.target }}'
      - name: Package both executables
        run: |
          python3 scripts/package-release.py --target '${{ matrix.target }}' \
            --binary target/release/ronchi \
            --notices target/distribution/THIRD-PARTY-LICENSES.html \
            --surfpool-notices target/distribution/SURFPOOL-THIRD-PARTY-LICENSES.html
      - name: Test installed artifact and real Surfpool
        run: python3 scripts/test-release.py --directory target/distribution
      # Keep completed compilation/downloads even if a later product check fails.
      # Cache hits never skip tests, builds, notices, packaging or installed checks.
      - name: Save Cargo downloads
        if: ${{ always() && !cancelled() && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Save Rust build
        if: ${{ always() && !cancelled() && steps.rust-cache.outputs.cache-primary-key != '' && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/debug
            target/release
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Save license generator
        if: ${{ always() && !cancelled() && steps.install-license.outcome == 'success' && steps.tools-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ronchi-release-tools
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ronchi-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/distribution/ronchi-*.tar.gz
            target/distribution/ronchi-*.sha256
            target/distribution/install.sh
            target/distribution/release-version.txt

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ronchi-*
          merge-multiple: true
          path: distribution
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing release.' >&2
            exit 1
          fi
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            --title "Ronchi $RELEASE_TAG" "${flags[@]}" distribution/*
