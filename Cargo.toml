[package]
name = "ronchi"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
toml = "0.9"
schemars = "1"
url = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
thiserror = "2"
fs2 = "0.4"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "net", "signal", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1", "service"] }
http-body-util = "0.1"
bytes = "1"
bs58 = "0.5"
sha2 = "0.11"
base64 = "0.22"
solana-transaction = { version = "=6.0.0", features = ["wincode", "verify", "serde"] }
solana-message = { version = "=6.0.0", features = ["wincode", "serde"] }
wincode = "0.6"
getrandom = "0.4"
libc = "0.2"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"
ed25519-dalek = "2"
