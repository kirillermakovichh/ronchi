[package]
name = "ronchi"
version = "0.1.1"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/kirillermakovichh/ronchi"
description = "A local reliability lab for Solana backends"

[dependencies]
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-io"] }
clap = { version = "4", features = ["derive", "env"] }
console = { version = "0.16", default-features = false, features = ["std", "ansi-parsing", "unicode-width"] }
indicatif = { version = "0.18", default-features = false, features = ["unicode-width"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
toml = "0.9"
schemars = "1"
url = "2"
rusqlite = { version = "0.41", features = ["bundled", "hooks", "functions"] }
thiserror = "2"
fs2 = "0.4"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "net", "signal", "time", "io-util", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1", "ws"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1", "service"] }
http-body-util = "0.1"
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
bs58 = "0.5"
sha2 = "0.11"
base64 = "0.22"
solana-transaction = { version = "=6.0.0", features = ["wincode", "verify", "serde"] }
solana-message = { version = "=6.0.0", features = ["wincode", "serde"] }
wincode = "0.6"
solana-sdk-ids = "=3.1.0"
getrandom = "0.4"
libc = "0.2"
time = { version = "0.3", features = ["formatting", "parsing"] }

ed25519-dalek = "2"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring", "webpki-roots"] }
yaml-rust2 = { version = "0.13.0", default-features = false }

[dev-dependencies]
tokio-tungstenite = "0.29"
rmcp = { version = "=3.8.0", default-features = false, features = ["client"] }
tempfile = "3"
vt100 = "0.16"
