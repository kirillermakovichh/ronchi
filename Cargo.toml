[package]
name = "ronchi"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
schemars = "1"
url = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
thiserror = "2"
fs2 = "0.4"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
