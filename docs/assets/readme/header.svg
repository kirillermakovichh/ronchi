<title id="title">Ronchi — Make hidden failures visible.</title>
<desc id="desc">Parallel bands bend around a controlled deviation. Two yellow bands reveal the change.</desc>
<rect width="1280" height="340" rx="12" fill="#101216"/>
<g fill="#f0f3f6" font-family="Arial, Helvetica, sans-serif">
<text x="48" y="72" font-size="28" font-weight="700" letter-spacing="8">RONCHI</text>
<text x="46" y="161" font-size="58" font-weight="700" letter-spacing="-1.5">Make hidden</text>
<text x="46" y="229" font-size="58" font-weight="700" letter-spacing="-1.5">failures visible.</text>
<text x="48" y="291" font-size="21" fill="#bec8d5">Built for developers and coding agents.</text>
</g>
